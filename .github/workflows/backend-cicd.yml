name: Backend CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "novus-url-monitor-v2/**"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-deploy:
    name: Test & Deploy Backend
    runs-on: self-hosted

    defaults:
      run:
        working-directory: novus-url-monitor-v2

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check Python
        run: |
          python3 --version
          python3 -m pip --version || true

      - name: Create virtual environment
        run: |
          set -e

          echo "Creating Python virtual environment..."

          python3 -m venv venv

          test -x venv/bin/python
          test -x venv/bin/pip

          echo "Virtual environment created successfully"
          ./venv/bin/python --version
          ./venv/bin/pip --version

      - name: Install dependencies
        run: |
          set -e

          ./venv/bin/python -m pip install --upgrade pip
          ./venv/bin/python -m pip install -r requirements.txt

      - name: Compile Python files
        run: |
          set -e

          ./venv/bin/python -m compileall app

      - name: Run tests
        run: |
          set -e

          ./venv/bin/python -m pytest -q

      - name: Deploy backend
        run: |
          set -e

          SOURCE_DIR="$GITHUB_WORKSPACE/novus-url-monitor-v2"
          DEPLOY_DIR="/home/novus/novus-platform/novus-url-monitor-v2"

          echo "======================================"
          echo "Deploying backend"
          echo "======================================"

          echo "Checking source..."

          test -d "$SOURCE_DIR/app"
          test -f "$SOURCE_DIR/requirements.txt"

          echo "Checking production directory..."

          test -d "$DEPLOY_DIR"

          echo "Syncing application files..."

          rsync -a \
            --exclude "venv/" \
            --exclude ".env" \
            --exclude "__pycache__/" \
            --exclude "*.pyc" \
            "$SOURCE_DIR/" \
            "$DEPLOY_DIR/"

          echo "Entering production directory..."

          cd "$DEPLOY_DIR"

          echo "Checking production virtual environment..."

          if [ ! -x "venv/bin/python" ]; then
            echo "Production virtual environment missing."
            echo "Creating production virtual environment..."

            python3 -m venv venv
          fi

          test -x venv/bin/python

          echo "Production Python version:"
          ./venv/bin/python --version

          echo "Installing production dependencies..."

          ./venv/bin/python -m pip install --upgrade pip
          ./venv/bin/python -m pip install -r requirements.txt

          echo "Compiling application..."

          ./venv/bin/python -m compileall app

          echo "Restarting backend services..."

          supervisorctl restart novus-url-alert-monitor
          supervisorctl restart novus-monitor-worker

          echo "Waiting for services..."

          sleep 5

          echo "Checking backend services..."

          supervisorctl status novus-url-alert-monitor
          supervisorctl status novus-monitor-worker

          echo "======================================"
          echo "Backend deployment completed"
          echo "======================================"