name: Backend CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "novus-url-monitor-v2/**"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-deploy:
    name: Test & Deploy Backend
    runs-on: self-hosted

    defaults:
      run:
        working-directory: novus-url-monitor-v2

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check Python
        run: |
          python3 --version

      - name: Activate virtual environment
        run: |
          test -f venv/bin/activate
          source venv/bin/activate
          python --version

      - name: Install dependencies
        run: |
          source venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python files
        run: |
          source venv/bin/activate
          python -m compileall app

      - name: Run tests
        run: |
          source venv/bin/activate
          pytest -q

      - name: Deploy backend
        run: |
          set -e

          SOURCE_DIR="$GITHUB_WORKSPACE/novus-url-monitor-v2"
          DEPLOY_DIR="/home/novus/novus-platform/novus-url-monitor-v2"

          echo "======================================"
          echo "Deploying backend"
          echo "======================================"

          echo "Checking source..."

          test -d "$SOURCE_DIR/app"
          test -f "$SOURCE_DIR/requirements.txt"

          echo "Syncing application files..."

          rsync -a \
            --exclude "venv/" \
            --exclude ".env" \
            --exclude "__pycache__/" \
            --exclude "*.pyc" \
            "$SOURCE_DIR/" \
            "$DEPLOY_DIR/"

          echo "Activating production virtual environment..."

          cd "$DEPLOY_DIR"

          source venv/bin/activate

          echo "Installing production dependencies..."

          python -m pip install -r requirements.txt

          echo "Compiling application..."

          python -m compileall app

          echo "Restarting backend services..."

          supervisorctl restart novus-url-alert-monitor
          supervisorctl restart novus-monitor-worker

          echo "Waiting for services..."

          sleep 5

          echo "Checking backend services..."

          supervisorctl status novus-url-alert-monitor
          supervisorctl status novus-monitor-worker

          echo "======================================"
          echo "Backend deployment completed"
          echo "======================================"