name: Frontend CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-production
  cancel-in-progress: true

jobs:

  # ==========================================
  # BUILD
  # ==========================================
  build:
    name: Build Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Verify build
        run: |
          set -e

          test -f dist/index.html
          test -d dist/assets

          echo "Frontend build verified successfully"

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7


  # ==========================================
  # DEPLOY
  # ==========================================
  deploy:
    name: Deploy Frontend
    needs: build

    # Production server par configured self-hosted runner
    runs-on: [self-hosted, linux, x64]

    steps:

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: /tmp/novus-frontend-deploy

      - name: Deploy frontend
        shell: bash
        run: |
          set -euo pipefail

          FRONTEND_DIR="/home/novus/novus-platform/frontend"
          DIST_DIR="$FRONTEND_DIR/dist"
          TEMP_DIR="/tmp/novus-frontend-deploy"
          NEW_DIST="$FRONTEND_DIR/.dist-new"

          echo "======================================"
          echo "NOVUS FRONTEND DEPLOYMENT"
          echo "======================================"

          echo "Deployment user:"
          whoami

          if [ "$(whoami)" != "novus" ]; then
            echo "ERROR: Runner must run as novus user"
            exit 1
          fi

          echo ""
          echo "Checking frontend directory..."

          test -d "$FRONTEND_DIR"

          echo "Frontend directory:"
          ls -ld "$FRONTEND_DIR"

          echo ""
          echo "Checking downloaded artifact..."

          test -f "$TEMP_DIR/index.html"
          test -d "$TEMP_DIR/assets"

          echo "Artifact verified successfully"

          echo ""
          echo "Preparing new dist directory..."

          rm -rf "$NEW_DIST"
          mkdir -p "$NEW_DIST"

          echo ""
          echo "Copying new frontend build..."

          cp -a "$TEMP_DIR"/. "$NEW_DIST"/

          echo ""
          echo "Verifying new deployment..."

          test -f "$NEW_DIST/index.html"
          test -d "$NEW_DIST/assets"

          echo ""
          echo "New frontend files:"

          find "$NEW_DIST" -maxdepth 2 -type f | head -30

          echo ""
          echo "Replacing current dist..."

          rm -rf "$DIST_DIR"
          mv "$NEW_DIST" "$DIST_DIR"

          echo ""
          echo "Final deployment directory:"

          ls -ld "$DIST_DIR"
          ls -l "$DIST_DIR/index.html"

          echo ""
          echo "Testing local frontend..."

          curl -fsSI \
            -H "Host: novus-alert.yashdevops.com" \
            http://127.0.0.1/

          echo ""
          echo "======================================"
          echo "FRONTEND DEPLOYMENT SUCCESSFUL"
          echo "======================================"
