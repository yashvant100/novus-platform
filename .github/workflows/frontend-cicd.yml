name: Frontend CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-production
  cancel-in-progress: true

jobs:
  build:
    name: Build Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Verify build
        run: |
          set -e

          test -f dist/index.html
          test -d dist/assets

          echo "Frontend build verified successfully"

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7


  deploy:
    name: Deploy Frontend
    needs: build

    # IMPORTANT:
    # This runner must be installed on the production server
    # and must run as the novus user.
    runs-on: self-hosted

    steps:
      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: /tmp/novus-frontend-deploy

      - name: Deploy frontend
        shell: bash
        run: |
          set -euo pipefail

          FRONTEND_DIR="/home/novus/novus-platform/frontend"
          DIST_DIR="$FRONTEND_DIR/dist"
          TEMP_DIR="/tmp/novus-frontend-deploy"

          echo "======================================"
          echo "Starting frontend deployment"
          echo "======================================"

          echo "Deployment user:"
          whoami

          echo "Checking frontend directory..."
          test -d "$FRONTEND_DIR"

          echo "Checking downloaded build..."
          test -f "$TEMP_DIR/index.html"
          test -d "$TEMP_DIR/assets"

          echo "Checking current ownership..."
          ls -ld "$FRONTEND_DIR"
          ls -ld "$DIST_DIR" 2>/dev/null || true

          echo "Creating temporary deployment directory..."

          NEW_DIST="${FRONTEND_DIR}/.dist-new"

          rm -rf "$NEW_DIST"
          mkdir -p "$NEW_DIST"

          echo "Copying new frontend files..."

          cp -a "$TEMP_DIR"/. "$NEW_DIST"/

          echo "Verifying new frontend..."

          test -f "$NEW_DIST/index.html"
          test -d "$NEW_DIST/assets"

          echo "Setting ownership..."

          chown -R novus:novus "$NEW_DIST"

          echo "Replacing frontend dist..."

          rm -rf "$DIST_DIR"
          mv "$NEW_DIST" "$DIST_DIR"

          echo "Final ownership:"
          ls -ld "$DIST_DIR"
          ls -l "$DIST_DIR/index.html"

          echo "======================================"
          echo "Testing Nginx response"
          echo "======================================"

          curl -fsSI \
            -H "Host: novus-alert.yashdevops.com" \
            http://127.0.0.1/

          echo "======================================"
          echo "Frontend deployment completed"
          echo "======================================"